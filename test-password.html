<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test Password Function</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
    .result { margin: 10px 0; padding: 10px; border: 1px solid #333; border-radius: 5px; }
    .success { border-color: #4CAF50; background: #2d4a2d; }
    .error { border-color: #f44336; background: #4a2d2d; }
    .info { border-color: #2196F3; background: #2d3a4a; }
    button { padding: 10px 20px; background: #52F756; color: #031b06; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
  </style>
</head>
<body>
  <h1>Test Password Function</h1>
  <div id="results"></div>
  
  <button onclick="testPasswordFunction()">Test Password Function</button>
  <button onclick="testPasswordPrompt()">Test Password Prompt</button>

  <script>
    // Copy the password function from challenge.html
    const RECORDING_PASSWORD = 'SuperSecret';
    let hasRecordingAccess = false;

    function addResult(title, status, message) {
      const div = document.createElement('div');
      div.className = `result ${status}`;
      div.innerHTML = `
        <h3>${title}</h3>
        <p>${message}</p>
      `;
      document.getElementById('results').appendChild(div);
    }

    function showToast(msg) {
      addResult('Toast', 'info', msg);
    }

    function updateCommunityFeed() {
      addResult('Community Feed', 'info', 'Community feed would be updated here');
    }

    // The password function from challenge.html
    window.promptRecordingPassword = function() {
      const password = prompt('Enter password to view recordings:');
      if (password === RECORDING_PASSWORD) {
        hasRecordingAccess = true;
        showToast('Access granted! 🎵');
        updateCommunityFeed(); // Refresh the feed to show recordings
      } else if (password !== null) { // Only show error if user didn't cancel
        showToast('Incorrect password. Please try again.');
      }
    };

    window.testPasswordFunction = function() {
      addResult('Test 1: Function Exists', 'info', 'Testing if promptRecordingPassword function exists...');
      
      if (typeof window.promptRecordingPassword === 'function') {
        addResult('Test 1: Function Exists', 'success', '✅ promptRecordingPassword function exists');
      } else {
        addResult('Test 1: Function Exists', 'error', '❌ promptRecordingPassword function not found');
      }

      addResult('Test 2: Password Constant', 'info', 'Testing password constant...');
      addResult('Test 2: Password Constant', 'success', `Password is set to: "${RECORDING_PASSWORD}"`);

      addResult('Test 3: Access Variable', 'info', 'Testing access variable...');
      addResult('Test 3: Access Variable', 'info', `hasRecordingAccess is currently: ${hasRecordingAccess}`);
    };

    window.testPasswordPrompt = function() {
      addResult('Test 4: Password Prompt', 'info', 'Testing password prompt function...');
      window.promptRecordingPassword();
    };

    // Auto-run basic tests
    window.testPasswordFunction();
  </script>
</body>
</html>
